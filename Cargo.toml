[workspace]
members = [
  "crates/ticket-core",
  "crates/ticket-kde",
]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"
authors = ["Miroslav Machynka"]

[profile.dev]
# Full debuginfo dominates link time for the Qt/C++ dependency chain.
# Line tables keep file and line numbers in backtraces at a fraction of the size.
debug = "line-tables-only"
split-debuginfo = "unpacked"

[workspace.metadata.application]
display_name = "AdmitPress"
binary_name = "admitpress"
config_slug = "admitpress"

[workspace.dependencies]
base64 = "0.22"
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
flate2 = "1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
zip = { version = "4.6.1", default-features = false }
